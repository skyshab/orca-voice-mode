[project]
name = "voice-mode-helper"
version = "0.1.0"
description = "Local speech in and out for Claude agents in Orca"
requires-python = ">=3.12"
dependencies = [
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.6",
    "mlx-whisper>=0.4.3",
    "parakeet-mlx>=0.7.0",
    "pynput>=1.8.2",
    "pyobjc-framework-avfoundation>=13.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[tool.uv]
package = false  # an app, not a library: nothing to build or install
